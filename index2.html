<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>บันทึกข้อความ</title>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: linear-gradient(180deg,#020617,#0f172a);
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      text-align: center;
      color: gold;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 16px;
      margin: 10px 0;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-top: 8px;
      font-weight: bold;
    }

    .save { background: #22c55e; }
    .clear { background: #ef4444; }
    .copy { background: #3b82f6; }
    .copy.done { background: #22c55e; }
    .delete { background: #ef4444; }
    .reset { background: #f59e0b; }

    .note {
      background: #0f172a;
      padding: 10px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .badge {
      font-size: 12px;
      opacity: 0.7;
    }

  </style>
</head>

<body>
<div class="container">

<h1>📋 บันทึกข้อความ</h1>

<div class="card">
  <textarea id="input" placeholder="พิมพ์ข้อความ..."></textarea>
  <button class="save" onclick="add()">บันทึก</button>
  <button class="clear" onclick="clearInput()">ล้าง</button>
  <button class="reset" onclick="reset()">รีเซ็ต 13 แฮชแท็ก</button>
</div>

<div id="list"></div>

</div>

<script>
const KEY = "notes_v2";

const defaultData = [
"#RoV #คลิปRoV #rovth",
"#RoV #RoVเป็นเกมตลก #คลิปRoV",
"#RoV #ควิกแชทนี้พี่จัดให้ #หยุดโลกด้วยเสียง #GildurPASULOL",
"#RoV #Flowborn #ฮีโร่ใหม่RoV #FlowbornPreheat",
"#RoV #RoVเป็นเกมตลก #rovth",
"#RoV #RoVเป็นเกมตลก #fpy",
"#RoV #RoVเป็นเกมตลก #trending",
"#RoV #RoVเป็นเกมตลก #เล่นRoV",
"#RoV #RoVเป็นเกมตลก #RoVเกมภาพสวย",
"#RoV #rovth #คลิปRoV",
"#RoV #rovth #RoVThailand",
"#RoV #ควิกแชทนี้พี่จัดให้ #TeamKongInRoV",
"#RoV #RoVเรียกเพื่อนกลับบ้าน #CallbackRoV"
];

let notes = JSON.parse(localStorage.getItem(KEY)) || defaultData;
let copied = new Set();

function save() {
  localStorage.setItem(KEY, JSON.stringify(notes));
}

function add() {
  let val = input.value.trim();
  if (!val) return;

  notes.unshift(val); // ใหม่อยู่บนสุด
  input.value = "";
  save();
  render();
}

function clearInput() {
  input.value = "";
}

function remove(i) {
  notes.splice(i,1);
  save();
  render();
}

function copyText(text, i) {
  navigator.clipboard.writeText(text);
  copied.add(i);
  render();
}

function reset() {
  localStorage.removeItem(KEY);
  notes = [...defaultData];
  copied.clear();
  render();
}

function render() {
  list.innerHTML = "";

  if (notes.length === 0) {
    list.innerHTML = "<p>ไม่มีข้อมูล</p>";
    return;
  }

  notes.forEach((t,i)=>{
    list.innerHTML += `
      <div class="card">
        <div class="badge">ชุด ${i+1}</div>
        <div class="note">${t}</div>

        <button class="copy ${copied.has(i) ? 'done':''}" onclick="copyText(\`${t}\`,${i})">
          ${copied.has(i) ? '✅ คัดลอกแล้ว' : 'คัดลอก'}
        </button>

        <button class="delete" onclick="remove(${i})">ลบ</button>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
